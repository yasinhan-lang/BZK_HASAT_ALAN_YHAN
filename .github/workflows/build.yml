name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adlandır
        run: cp app/build/outputs/apk/release/app-release.apk BozokluHAN_Hasat_Alan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BozokluHAN_Hasat_Alan
          path: BozokluHAN_Hasat_Alan.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: BozokluHAN ALAN ÖLÇER v1.1.${{ github.run_number }}
          files: BozokluHAN_Hasat_Alan.apk
